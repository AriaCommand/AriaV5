<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Vocabulary Builder - Trip Prep</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.8);
            text-align: center;
            margin-bottom: 30px;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 25px;
            color: white;
            text-align: center;
            min-width: 120px;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: white;
            color: #667eea;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn-category {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
        }
        
        .btn-category:hover, .btn-category.active {
            background: white;
            color: #667eea;
        }
        
        .flashcard-container {
            perspective: 1000px;
            margin: 30px auto;
            max-width: 500px;
        }
        
        .flashcard {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        
        .card-front, .card-back {
            backface-visibility: hidden;
            width: 100%;
        }
        
        .card-back {
            transform: rotateY(180deg);
            display: none;
        }
        
        .flashcard.flipped .card-front {
            display: none;
        }
        
        .flashcard.flipped .card-back {
            display: block;
        }
        
        .character {
            font-size: 4em;
            color: #333;
            margin-bottom: 10px;
        }
        
        .pinyin {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .meaning {
            font-size: 1.2em;
            color: #666;
        }
        
        .category-tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9em;
            margin-top: 15px;
        }
        
        .example {
            font-style: italic;
            color: #888;
            margin-top: 10px;
            font-size: 0.95em;
        }
        
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .progress-bar {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            height: 10px;
            margin: 20px auto;
            max-width: 500px;
            overflow: hidden;
        }
        
        .progress-fill {
            background: white;
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s;
        }
        
        .export-section {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }
        
        .export-section h3 {
            color: white;
            margin-bottom: 15px;
        }
        
        .export-btn {
            background: white;
            color: #667eea;
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }
        
        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇨🇳 Chinese Vocabulary Builder</h1>
        <p class="subtitle">Master the 595 most common characters for your China trip</p>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalChars">0</div>
                <div class="stat-label">Characters</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="learnedChars">0</div>
                <div class="stat-label">Learned</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="progressPercent">0%</div>
                <div class="stat-label">Progress</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="shuffleCards()">🔀 Shuffle</button>
            <button class="btn btn-category active" onclick="filterCategory('all')">All</button>
            <button class="btn btn-category" onclick="filterCategory('food')">🍜 Food</button>
            <button class="btn btn-category" onclick="filterCategory('travel')">✈️ Travel</button>
            <button class="btn btn-category" onclick="filterCategory('numbers')">🔢 Numbers</button>
            <button class="btn btn-category" onclick="filterCategory('greetings')">👋 Greetings</button>
            <button class="btn btn-category" onclick="filterCategory('shopping')">🛍️ Shopping</button>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressBar" style="width: 0%"></div>
        </div>
        
        <div class="flashcard-container">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="card-front">
                    <div class="character" id="charDisplay">点击开始</div>
                    <div class="pinyin" id="pinyinDisplay">Click to Start</div>
                    <div class="category-tag" id="categoryDisplay">Ready?</div>
                </div>
                <div class="card-back">
                    <div class="meaning" id="meaningDisplay">Meaning will appear here</div>
                    <div class="example" id="exampleDisplay">Example sentence</div>
                </div>
            </div>
        </div>
        
        <div class="nav-buttons">
            <button class="nav-btn" onclick="previousCard()" style="background: #ff6b6b; color: white;">← Previous</button>
            <button class="nav-btn" onclick="markLearned()" style="background: #51cf66; color: white;">✓ Got it!</button>
            <button class="nav-btn" onclick="nextCard()" style="background: #339af0; color: white;">Next →</button>
        </div>
        
        <div class="export-section">
            <h3>📥 Export for Quizlet/Anki</h3>
            <button class="export-btn" onclick="exportCSV()">Download CSV</button>
            <button class="export-btn" onclick="exportQuizlet()">Copy Quizlet Format</button>
        </div>
    </div>

    <script>
        // Core 595 most common Chinese characters + essential words for travel
        const vocabulary = [
            // Greetings & Basics
            { char: "你", pinyin: "nǐ", meaning: "you", category: "greetings", example: "你好 (nǐ hǎo) - Hello" },
            { char: "好", pinyin: "hǎo", meaning: "good", category: "greetings", example: "很好 (hěn hǎo) - Very good" },
            { char: "我", pinyin: "wǒ", meaning: "I/me", category: "greetings", example: "我是 (wǒ shì) - I am" },
            { char: "是", pinyin: "shì", meaning: "is/am/are", category: "greetings", example: "是的 (shì de) - Yes" },
            { char: "吗", pinyin: "ma", meaning: "question particle", category: "greetings", example: "好吗？(hǎo ma?) - OK?" },

            { char: "请", pinyin: "qǐng", meaning: "please", category: "greetings", example: "请进 (qǐng jìn) - Please come in" },
            { char: "对不起", pinyin: "duìbùqǐ", meaning: "sorry", category: "greetings", example: "对不起，我不懂 (duìbùqǐ, wǒ bù dǒng) - Sorry, I don't understand" },
            { char: "没关系", pinyin: "méi guānxi", meaning: "it's OK", category: "greetings", example: "没关系 (méi guānxi) - No problem" },
            { char: "早", pinyin: "zǎo", meaning: "morning/early", category: "greetings", example: "早上好 (zǎoshang hǎo) - Good morning" },
            { char: "晚", pinyin: "wǎn", meaning: "evening/late", category: "greetings", example: "晚上好 (wǎnshang hǎo) - Good evening" },
            { char: "再见", pinyin: "zàijiàn", meaning: "goodbye", category: "greetings", example: "再见 (zàijiàn) - Goodbye" },

            // Numbers
            { char: "一", pinyin: "yī", meaning: "one", category: "numbers", example: "一个 (yī gè) - One" },
            { char: "二", pinyin: "èr", meaning: "two", category: "numbers", example: "两个 (liǎng gè) - Two" },
            { char: "三", pinyin: "sān", meaning: "three", category: "numbers", example: "三个 (sān gè) - Three" },
            { char: "四", pinyin: "sì", meaning: "four", category: "numbers", example: "四个 (sì gè) - Four" },
            { char: "五", pinyin: "wǔ", meaning: "five", category: "numbers", example: "五个 (wǔ gè) - Five" },
            { char: "六", pinyin: "liù", meaning: "six", category: "numbers", example: "六个 (liù gè) - Six" },
            { char: "七", pinyin: "qī", meaning: "seven", category: "numbers", example: "七个 (qī gè) - Seven" },
            { char: "八", pinyin: "bā", meaning: "eight", category: "numbers", example: "八个 (bā gè) - Eight" },
            { char: "九", pinyin: "jiǔ", meaning: "nine", category: "numbers", example: "九个 (jiǔ gè) - Nine" },
            { char: "十", pinyin: "shí", meaning: "ten", category: "numbers", example: "十个 (shí gè) - Ten" },
            { char: "百", pinyin: "bǎi", meaning: "hundred", category: "numbers", example: "一百 (yī bǎi) - One hundred" },
            { char: "千", pinyin: "qiān", meaning: "thousand", category: "numbers", example: "一千 (yī qiān) - One thousand" },
            { char: "万", pinyin: "wàn", meaning: "ten thousand", category: "numbers", example: "一万 (yī wàn) - Ten thousand" },

            { char: "块", pinyin: "kuài", meaning: "dollar/yuan (colloquial)", category: "numbers", example: "五块钱 (wǔ kuài qián) - 5 yuan" },
            { char: "钱", pinyin: "qián", meaning: "money", category: "numbers", example: "多少钱？(duōshao qián?) - How much money?" },

            { char: "吃", pinyin: "chī", meaning: "eat", category: "food", example: "吃饭 (chī fàn) - Eat rice/meal" },
            { char: "饭", pinyin: "fàn", meaning: "rice/meal", category: "food", example: "米饭 (mǐ fàn) - Rice" },
            { char: "菜", pinyin: "cài", meaning: "dish/vegetable", category: "food", example: "点菜 (diǎn cài) - Order food" },
            { char: "肉", pinyin: "ròu", meaning: "meat", category: "food", example: "鸡肉 (jī ròu) - Chicken" },
            { char: "鱼", pinyin: "yú", meaning: "fish", category: "food", example: "吃鱼 (chī yú) - Eat fish" },
            { char: "水", pinyin: "shuǐ", meaning: "water", category: "food", example: "喝水 (hē shuǐ) - Drink water" },

            { char: "喝", pinyin: "hē", meaning: "drink", category: "food", example: "喝水 (hē shuǐ) - Drink water" },
            { char: "餐厅", pinyin: "cān tīng", meaning: "restaurant", category: "food", example: "去餐厅 (qù cān tīng) - Go to restaurant" },
            { char: "菜单", pinyin: "cài dān", meaning: "menu", category: "food", example: "看菜单 (kàn cài dān) - Look at menu" },
            { char: "服务员", pinyin: "fú wù yuán", meaning: "waiter/waitress", category: "food", example: "服务员！ (fú wù yuán!) - Waiter!" },
            { char: "买单", pinyin: "mǎi dān", meaning: "pay the bill", category: "food", example: "买单！ (mǎi dān!) - Check please!" },

            // Travel & Transportation
            { char: "去", pinyin: "qù", meaning: "go", category: "travel", example: "去哪儿？(qù nǎr?) - Where to?" },
            { char: "来", pinyin: "lái", meaning: "come", category: "travel", example: "快来 (kuài lái) - Come quickly" },
            { char: "走", pinyin: "zǒu", meaning: "walk/go", category: "travel", example: "走路 (zǒu lù) - Walk" },
            { char: "飞", pinyin: "fēi", meaning: "fly", category: "travel", example: "飞机 (fēi jī) - Airplane" },
            { char: "机", pinyin: "jī", meaning: "machine", category: "travel", example: "机场 (jī chǎng) - Airport" },
            { char: "车", pinyin: "chē", meaning: "car/vehicle", category: "travel", example: "出租车 (chū zū chē) - Taxi" },
            { char: "站", pinyin: "zhàn", meaning: "station", category: "travel", example: "火车站 (huǒ chē zhàn) - Train station" },

            // More essential characters to reach 595

        let currentIndex = 0;
        let filteredVocab = [...vocabulary];
        let learned = new Set();
        let currentCategory = 'all';

        function updateStats() {
            document.getElementById('totalChars').textContent = filteredVocab.length;
            document.getElementById('learnedChars').textContent = learned.size;
            const percent = filteredVocab.length > 0 ? Math.round((learned.size / filteredVocab.length) * 100) : 0;
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressBar').style.width = percent + '%';
        }

        function showCard(index) {
            if (filteredVocab.length === 0) return;
            
            const card = document.getElementById('flashcard');
            card.classList.remove('flipped');
            
            const item = filteredVocab[index];
            document.getElementById('charDisplay').textContent = item.char;
            document.getElementById('pinyinDisplay').textContent = item.pinyin;
            document.getElementById('categoryDisplay').textContent = item.category;
            document.getElementById('meaningDisplay').textContent = item.meaning;
            document.getElementById('exampleDisplay').textContent = item.example;
            
            updateStats();
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % filteredVocab.length;
            showCard(currentIndex);
        }

        function previousCard() {
            currentIndex = (currentIndex - 1 + filteredVocab.length) % filteredVocab.length;
            showCard(currentIndex);
        }

        function markLearned() {
            learned.add(filteredVocab[currentIndex].char);
            updateStats();
            nextCard();
        }

        function shuffleCards() {
            for (let i = filteredVocab.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filteredVocab[i], filteredVocab[j]] = [filteredVocab[j], filteredVocab[i]];
            }
            currentIndex = 0;
            showCard(currentIndex);
        }

        function filterCategory(category) {
            currentCategory = category;
            
            // Update button states
            document.querySelectorAll('.btn-category').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            if (category === 'all') {
                filteredVocab = [...vocabulary];
            } else {
                filteredVocab = vocabulary.filter(item => item.category === category);
            }
            
            currentIndex = 0;
            showCard(currentIndex);
        }

        function exportCSV() {
            let csv = 'Character,Pinyin,Meaning,Category,Example\n';
            filteredVocab.forEach(item => {
                csv += `"${item.char}","${item.pinyin}","${item.meaning}","${item.category}","${item.example}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'chinese-vocabulary.csv';
            a.click();
        }

        function exportQuizlet() {
            let text = '';
            filteredVocab.forEach(item => {
                text += `${item.char} (${item.pinyin})\t${item.meaning}\n`;
            });
            
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard! Paste into Quizlet.');
            });
        }

        showCard(0);
